name: Generated code

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dart-lang/setup-dart@v1
      - run: npm ci
      - run: python -m pip install "pydantic>=2,<3" ruff
      - run: npm run validate:typescript
      - run: npm run validate:python
      - run: npm run validate:dart
